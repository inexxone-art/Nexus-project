name: Godot 4 - PROJECT NEXUS Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-tests:
    name: Import and gameplay smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot 4.4.1
        run: |
          curl --fail --location --retry 3 -o godot.zip \
            'https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip'
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Static source checks
        run: python3 tests/validate_project.py
      - name: Verify vehicle fleet definitions
        run: python3 tests/validate_fleet.py
      - name: Verify V1.4 design and feature integration
        run: python3 tests/validate_v14.py
      - name: Verify V1.5 mission state machines and photo capture wiring
        run: python3 tests/validate_v15.py
      - name: Verify V1.7 detailed vehicle models and showroom
        run: python3 tests/validate_v17.py
      - name: Validate V1.8 flagship vehicle upgrades
        run: python3 tests/validate_v18.py
      - name: Validate V2.0 interconnected gameplay and mobile controls
        run: python3 tests/validate_v20.py
      - name: Validate V2.1 player economy and history wiring
        run: python3 tests/validate_v21.py
      - name: Trailer pipeline unit checks
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Import assets and check script syntax
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' godot-import.log; then
            echo '::error::Godot reported a script import/parse error'
            exit 1
          fi
      - name: Validate 123 vehicles and planet narratives
        run: timeout 60s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/fleet_smoke.gd
      - name: Existing Alpine gameplay regression
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/smoke.gd
      - name: Six-planet story gameplay tests
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/solar_smoke.gd
      - name: Living Universe deterministic incidents
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/living_smoke.gd
      - name: Cinematic polish and world persistence
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/visual_smoke.gd
      - name: Multi-stage operation and consequence regression
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/operations_smoke.gd
      - name: Cinematic camera input and UI restoration
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/photo_smoke.gd
      - name: Touch input regression for browser preview
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/mobile_smoke.gd
      - name: Flagship vehicles geometry and animation smoke test
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/hero_vehicle_smoke.gd
      - name: Detailed vehicle assembly and controls
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/vehicle_detail_smoke.gd
      - name: World Quality V2.0 integration smoke test
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/quality_v20_smoke.gd
      - name: V2.1 career economy and chronicle smoke test
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/legacy_logic_smoke.gd
      - name: V2.1 real world economy save/load integration
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/legacy_world_smoke.gd
      - name: V2.2 Berglicht story and articulated actor integration
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/episode_v22_smoke.gd
      - name: Static V2.2 mission and save/load contract
        run: python3 tests/validate_v22.py

      - name: V2.3 graphics asset contract and references
        run: python3 tests/validate_v23.py
      - name: V2.3 Godot wet shader and village smoke test
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/graphics_v23_smoke.gd

      - name: V2.5 Alpine connected district graph and scenic streaming
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/world_structure_v25_smoke.gd
      - name: Static V2.5 district streaming and route contract
        run: python3 tests/validate_world_structure_v25.py

      - name: Validate V2.7 original megamap source contracts
        run: python3 tests/validate_megaworld_v27.py
      - name: Five regions and six planet settlement Godot smoke test
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/megaworld_v27_smoke.gd

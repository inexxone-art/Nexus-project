name: Godot 4 - PROJECT NEXUS Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-tests:
    name: Import and gameplay smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot 4.4.1
        run: |
          curl --fail --location --retry 3 -o godot.zip \
            'https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip'
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Static source checks
        run: python3 tests/validate_project.py
      - name: Verify vehicle fleet definitions
        run: python3 tests/validate_fleet.py
      - name: Verify V1.4 design and feature integration
        run: python3 tests/validate_v14.py
      - name: Import assets and check script syntax
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Validate 123 vehicles and planet narratives
        run: timeout 60s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/fleet_smoke.gd
      - name: Existing Alpine gameplay regression
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/smoke.gd
      - name: Six-planet story gameplay tests
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/solar_smoke.gd
      - name: Living Universe deterministic incidents
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/living_smoke.gd
      - name: Cinematic polish and world persistence
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/visual_smoke.gd

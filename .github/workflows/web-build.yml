name: Experimental NEXUS Web Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  web-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot binary and official export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip 'https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip'
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 -o templates.tpz 'https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz'
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d /tmp/nexus-godot-templates
          cp /tmp/nexus-godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Validate project and import assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validate_project.py
          python3 tests/validate_v15.py
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Export experimental HTML5 build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release 'Web' build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: PROJECT-NEXUS-WEB-PREVIEW
          path: build/web/
          retention-days: 14
      - name: Check whether GitHub Pages is enabled
        id: pages_state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${GH_REPO}/pages" > /dev/null 2>&1; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages not enabled; uploaded web preview artifact is available.'
          fi
      - name: Configure GitHub Pages
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/
      - name: Publish browser preview
        id: deployment
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4

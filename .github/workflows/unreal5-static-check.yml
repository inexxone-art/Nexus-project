name: NEXUS UE5 Migration - Static Validation

on:
  push:
    branches:
      - feature/unreal5-nexus-adlerklamm-foundation
    paths:
      - "Unreal/NEXUS_UE5/**"
      - ".github/workflows/unreal5-static-check.yml"
  pull_request:
    paths:
      - "Unreal/NEXUS_UE5/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unreal 5.8 project and migration contracts
        run: python3 Unreal/NEXUS_UE5/Scripts/validate_migration.py
